site:
  name: 'LEXI Alpha'
  site: 'https://mana-landing-production.up.railway.app'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
  title:
    default: 'LEXI Alpha'
    template: '%s — LEXI Alpha • Método MANA 3.0'
    description: 'Você não estuda para falar. Você fala para aprender. Destrave seu inglês sem gramática escolar com os 5 Portais da Montanha B2 e tutores de IA com Recasting Natural.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'LEXI Alpha'
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
    twitter:
      handle: '@arthelokyo'
      site: '@arthelokyo'
      cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'dark' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
